aid: allwork
name: AllWork
description: 'AllWork is a New York-based flexible-workforce management and payments
  platform for contingent labor. It combines onboarding, scheduling, budgeting and
  planning, time and attendance with GPS-confirmed check-in, timesheet and expense
  approval, payroll, reporting and analytics, and a manager mobile app into one
  system, and acts as both Employer of Record (EOR) and Agent of Record (AOR) so a
  brand can compliantly engage and pay W-2 and 1099 talent across the United States,
  Canada and internationally. It sells into beauty and luxury, retail, food and
  beverage, oil and gas, technology and engineering, life sciences and healthcare,
  financial services, and self-direction programs, handling worker classification,
  labor-law adherence, and federal, state and local tax filings. AllWork publishes
  no public developer program: there is no API reference, no SDK, and no
  machine-readable specification on its site.'
